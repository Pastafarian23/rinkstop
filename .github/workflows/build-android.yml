name: Build Android APK

# Triggers:
# - Push to main: auto-build (catches broken Android builds before deploy)
# - Manual dispatch: build any branch on demand
# - Pull request to main: validate the build before merge (no upload to keep PRs clean)
#
# What it does:
# 1. Spins up ubuntu-latest runner
# 2. Installs JDK 17 + Android SDK 34 + pnpm
# 3. Runs pnpm install + pnpm run build (Next.js → .next/)
# 4. Runs npx cap sync android (copies web assets + Capacitor config to android/)
# 5. Runs cd android && ./gradlew assembleDebug
# 6. Uploads the debug APK as a build artifact (90-day retention)
#
# Cost: $0 for public repos (Pastafarian23/rinkstop is public)
# Time: ~5-8 min per build, first build ~10-12 min (downloads SDK + Gradle deps)
#
# To download the APK:
# 1. Go to https://github.com/Pastafarian23/rinkstop/actions
# 2. Click the workflow run
# 3. Scroll to "Artifacts" at the bottom
# 4. Download "app-debug"
# 5. Unzip → app-debug.apk
# 6. On your phone: Settings → Security → Install unknown apps → allow
# 7. Tap the APK to install (or use ADB: adb install app-debug.apk)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm 9
        run: npm install -g pnpm@9

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Install Android SDK manually (more reliable than third-party actions)
      # Source: official Google's Android cmdline-tools
      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_HOME
          cd $ANDROID_HOME
          echo "Downloading Android command-line tools..."
          curl -sL -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/NOTICE.txt cmdline-tools/source.properties cmdline-tools/latest/ 2>/dev/null || true
          rm cmdline-tools.zip
          echo "Installing SDK packages..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build Android debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error

      - name: Print build summary
        if: always()
        run: |
          echo "Build status: ${{ job.status }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "APK not produced (build likely failed)"
