name: Ping Search Engines

# Fires after every push to main (and on manual dispatch).
# Posts to /api/indexnow with the deploy secret so Bing/Yandex
# pick up the new URLs within minutes instead of waiting 1-2 weeks
# for the normal crawl cycle.
# Also calls /api/gsc/sitemap-submit to re-register all sub-sitemaps
# with Google Search Console (WS27 PR5a, 2026-09-14).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ping-search-engines
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping IndexNow
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          if [ -z "$ADMIN_SECRET" ]; then
            echo "::error::ADMIN_SECRET GitHub secret is not set."
            exit 1
          fi
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://rinkstop.com"
          fi
          echo "Pinging ${SITE_URL}/api/indexnow …"
          HTTP=$(curl -sS -o /tmp/ping.json -w '%{http_code}' \
            -X POST "${SITE_URL}/api/indexnow" \
            -H "x-deploy-secret: ${ADMIN_SECRET}" \
            -H 'Content-Type: application/json' \
            --data '{}')
          echo "HTTP $HTTP"
          cat /tmp/ping.json
          echo
          # Non-fatal if IndexNow returns 200 with failed batches — that's logged
          # but Bing will catch up via sitemap on the regular crawl cycle.
          if [ "$HTTP" != "200" ]; then
            echo "::warning::IndexNow ping returned HTTP $HTTP"
            exit 1
          fi

      # WS27 PR5a — re-register all sub-sitemaps with Google Search Console.
      # Before this step, 6 sub-sitemaps (ice-marketplace, images, events,
      # tools, guides, learn) had never been registered with GSC, leaving
      # ~3,200 URLs unindexed. The GSC submit endpoint also re-confirms the
      # existing 7 sitemaps so Google re-fetches them after every deploy.
      - name: Re-register sitemaps with Google Search Console
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          if [ -z "$ADMIN_SECRET" ]; then
            echo "::error::ADMIN_SECRET GitHub secret is not set."
            exit 1
          fi
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://rinkstop.com"
          fi
          echo "Re-registering sitemaps at ${SITE_URL}/api/gsc/sitemap-submit …"
          HTTP=$(curl -sS -o /tmp/gsc-submit.json -w '%{http_code}' \
            -X POST "${SITE_URL}/api/gsc/sitemap-submit" \
            -H "x-deploy-secret: ${ADMIN_SECRET}" \
            -H 'Content-Type: application/json' \
            --data '{}')
          echo "HTTP $HTTP"
          cat /tmp/gsc-submit.json
          echo
          # Non-fatal if any single sitemap fails — the route returns 200 with
          # a per-sitemap status array, so failures are logged but the step
          # stays green so the workflow run isn't marked failed.
          if [ "$HTTP" != "200" ]; then
            echo "::warning::GSC sitemap submit returned HTTP $HTTP"
            exit 1
          fi

      # WS27 PR8 — submit key URLs to Bing Webmaster Content API.
      # The legacy POX/SOAP endpoints (SubmitSitemap, GetSitemaps) were
      # retired 2026-08-31. The new JSON /webmaster/api.svc/json/SubmitUrlbatch
      # is the only working programmatic path. We submit the index page + the
      # 8 brand landing pages + a few key directory hubs (within the 500-url
      # batch limit) so Bing indexes them directly. IndexNow still handles the
      # bulk of URL discovery in parallel.
      - name: Submit URLs to Bing Webmaster
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          if [ -z "$ADMIN_SECRET" ]; then
            echo "::warning::ADMIN_SECRET GitHub secret is not set, skipping Bing."
            exit 0
          fi
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://rinkstop.com"
          fi
          echo "Submitting URLs to ${SITE_URL}/api/bing/submit-urls …"
          HTTP=$(curl -sS -o /tmp/bing-submit.json -w '%{http_code}' \
            -X POST "${SITE_URL}/api/bing/submit-urls" \
            -H "x-deploy-secret: ${ADMIN_SECRET}" \
            -H 'Content-Type: application/json' \
            --data '{"urls":["https://rinkstop.com/","https://rinkstop.com/gear-brands/","https://rinkstop.com/gear-brands/bauer","https://rinkstop.com/gear-brands/ccm","https://rinkstop.com/gear-brands/true","https://rinkstop.com/gear-brands/warrior","https://rinkstop.com/gear-brands/easton","https://rinkstop.com/gear-brands/sherwood","https://rinkstop.com/gear-brands/brians","https://rinkstop.com/gear-brands/tour","https://rinkstop.com/directory/teams","https://rinkstop.com/directory/leagues","https://rinkstop.com/directory/rinks","https://rinkstop.com/directory/nhl","https://rinkstop.com/directory/khl","https://rinkstop.com/directory/pwhl","https://rinkstop.com/sitemap.xml"]}')
          echo "HTTP $HTTP"
          cat /tmp/bing-submit.json
          echo
          if [ "$HTTP" != "200" ]; then
            echo "::warning::Bing URL submit returned HTTP $HTTP"
            exit 1
          fi
