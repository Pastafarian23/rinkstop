name: Home News Section E2E

on:
  pull_request:
    paths:
      - 'src/app/components/HomeNewsSection.tsx'
      - 'src/app/api/blog/posts/route.ts'
      - 'src/app/page.tsx'
      - 'scripts/e2e/home-news-smoke-test.ts'

jobs:
  smoke-test:
    name: Home news section smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke test
        run: pnpm exec tsx scripts/e2e/home-news-smoke-test.ts
        env:
          NEXT_PUBLIC_SITE_URL: https://rinkstop.com
