name: Deploy to Vercel (tag-triggered)

# Vercel Hobby plan deploys on every push to main, which means 21+ deploys/day
# on this project. The fair-use cap is 100/day but Vercel flags outliers
# before then. To stay under all limits:
#
# 1. Arnel turns OFF "Deploy on push" in Vercel project settings
#    (https://vercel.com/dashboard/[team]/rinkstop-platform/settings/git)
# 2. Arnel creates a Deploy Hook in Vercel:
#    Settings → Git → Deploy Hooks → Create Hook
#    Name: "tag-deploy", Branch: "main"
#    Vercel gives back a URL like https://api.vercel.com/v1/integrations/deploy/prj_xxx/yyy
# 3. Arnel adds that URL as a GitHub repo secret named VERCEL_DEPLOY_HOOK
#    (https://github.com/Pastafarian23/rinkstop/settings/secrets/actions)
# 4. (Optional) Update package.json scripts so you don't need to remember the
#    tag prefix: pnpm tag-deploy → git tag v0.1.0 && git push --tags
#
# After setup, the deploy flow is:
#   git commit ...
#   git push origin main              # no deploy fires (webhook disabled)
#   ... commit more stuff ...
#   git tag deploy-$(date +%Y%m%d-%H%M)
#   git push --tags                   # THIS triggers the deploy
#
# Rollback: just push a new tag. Vercel keeps last 50 deployments.

on:
  push:
    tags:
      - 'deploy-*'
      - 'v*.*.*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret is not set. Add it in GitHub repo settings."
            exit 1
          fi
          echo "Triggering deploy hook for tag: ${GITHUB_REF_NAME}"
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}")
          status=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | head -n -1)
          if [ "$status" = "201" ]; then
            echo "✅ Deploy triggered (201 Created)"
            echo "$body"
          else
            echo "::warning::Unexpected status $status"
            echo "$body"
            exit 0  # don't fail the workflow on non-201 — hook returns different codes for different states
          fi
